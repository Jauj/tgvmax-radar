name: Snapshot quotidien TGVmax

# Le relevé ne doit s'exécuter qu'UNE fois par jour (UTC). Le planificateur
# « cron » de GitHub Actions est capricieux : retards de plusieurs heures ou
# créneaux purement sautés (observé les 12, 13 et 14 septembre 2026).
# Stratégie watchdog : un créneau TOUTES LES 30 MINUTES + un garde-fou.
# Chaque exécution sautée coûte ~20 s et les dépôts publics ont des Actions
# illimitées. Un relevé part seulement si :
#   - il est 05:00 UTC ou plus (dataset nocturne rafraîchi), ET
#   - aucun relevé du jour n'existe déjà (_meta.json → lastRun), ET
#   - l'API SNCF répond (jusqu'à 3 tentatives).
# Déclencheurs additionnels : push sur main (rattrapage gratuit — le commit du
# robot lui-même ne re-déclenche rien, GITHUB_TOKEN ne s'auto-déclenche pas)
# et bouton manuel « Run workflow ».

on:
  schedule:
    - cron: '*/30 * * * *'   # watchdog : 48 chances par jour de capturer le relevé
  push:
    branches: [main]         # tout push sur main rattrape le relevé s'il manque
  workflow_dispatch: {}      # déclenchement manuel possible

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Garde-fou — faut-il un relevé ?
        run: |
          TODAY=$(date -u +%F)
          HOUR=$((10#$(date -u +%H)))
          SKIP=""
          if [ "$HOUR" -lt 5 ]; then
            echo "Avant 05:00 UTC — dataset nocturne pas encore rafraîchi, on attend."
            SKIP=true
          elif node -e "const m=require('./data/history/_meta.json');process.exit((m.lastRun||'').startsWith(process.argv[1])?0:1)" "$TODAY"; then
            echo "Relevé du $TODAY déjà enregistré — exécution sautée."
            SKIP=true
          else
            echo "Relevé du $TODAY absent — lancement du relevé."
          fi
          if [ -n "$SKIP" ]; then echo "SKIP=true" >> "$GITHUB_ENV"; fi

      - name: Relevé des disponibilités (3 tentatives)
        if: env.SKIP != 'true'
        run: |
          for i in 1 2 3; do
            if node scripts/daily-snapshot.mjs; then exit 0; fi
            echo "Tentative $i échouée — nouvel essai dans 30 s…"
            sleep 30
          done
          exit 1

      - name: Commit & push des données
        if: env.SKIP != 'true'
        run: |
          git config user.name "tgvmax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle — rien à committer"
          else
            git commit -m "Snapshot quotidien des disponibilités ($(date -u +%F))"
            git push
          fi
